name: Examples Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: Examples release gate
    runs-on: ubuntu-latest
    env:
      WORKSPAI_VERSION: 0.55.1
      RAPIDKIT_CORE_VERSION: 0.6.0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install poetry==2.4.1
      - run: npm install --global "workspai@${WORKSPAI_VERSION}"
      - run: npm run check
      - name: Restore RapidKit Core module payloads
        shell: bash
        run: |
          # hydrate:core uses `rapidkit modules restore --locked --ci` when
          # the workspace-pinned Core version exposes the restore command.
          npm run hydrate:core -- \
            --workspace quickstart-workspace \
            --project product-api \
            --project ecommerce-api
          npm run hydrate:core -- \
            --workspace my-ai-workspace \
            --project ai-agent
          npm run hydrate:core -- \
            --workspace saas-starter-workspace \
            --project saas-api \
            --project saas-admin \
            --project saas-webhooks
      - name: Verify RapidKit Core community baseline
        shell: bash
        run: |
          for workspace in \
            quickstart-workspace \
            my-ai-workspace \
            saas-starter-workspace
          do
            poetry --directory "$workspace" run python -c \
              "import importlib.metadata as m, os; assert m.version('rapidkit-core') == os.environ['RAPIDKIT_CORE_VERSION']"
          done
      - name: Verify Python projects
        shell: bash
        env:
          DEBUG: 'false'
        run: |
          for project in \
            quickstart-workspace/product-api \
            quickstart-workspace/ecommerce-api \
            my-ai-workspace/ai-agent \
            saas-starter-workspace/saas-api \
            saas-starter-workspace/saas-admin \
            saas-starter-workspace/saas-webhooks
          do
            poetry --directory "$project" install --no-interaction
            poetry --directory "$project" run pytest -q
          done
      - name: Verify NestJS projects
        shell: bash
        run: |
          for project in \
            my-ai-workspace/ai-agent-nest \
            saas-starter-workspace/saas-nest
          do
            npm --prefix "$project" ci
            npm --prefix "$project" run build
            npm --prefix "$project" test -- --runInBand
          done
      - name: Materialize CI-only project environments
        shell: bash
        run: |
          # Public examples commit reviewed templates, never populated runtime
          # environment files. Doctor verifies the materialized runtime state,
          # so create ephemeral, owner-readable copies only on this runner.
          for workspace in \
            quickstart-workspace \
            my-ai-workspace \
            saas-starter-workspace
          do
            while IFS= read -r -d '' template
            do
              install -m 600 "$template" "${template%.example}"
            done < <(find "$workspace" -mindepth 2 -maxdepth 2 -name .env.example -print0)
          done
      - name: Verify current Workspai workspace contracts
        shell: bash
        run: |
          workspai --version
          for workspace in \
            quickstart-workspace \
            my-ai-workspace \
            saas-starter-workspace
          do
            (
              cd "$workspace"
              workspai workspace sync --json
              workspai workspace contract verify --strict --json
              workspai workspace intelligence run --for-agent generic --json
            )
          done
